plugins {
    id 'idea'
    id 'java'
    id 'gg.essential.loom' version '0.10.0.+'
    id 'dev.architectury.architectury-pack200' version '0.1.3'
}

version = "1.0-1.8.9"
group = "net.johnseagull.pickup"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
}

loom {
    launchConfigs {
        client {
            // Mixin debugging configurations
            property "mixin.debug", "true"
            arg "--tweakClass", "org.spongepowered.asm.launch.MixinTweaker"
        }
    }
    forge {
        // Pack200 handles packaging decompression for legacy Forge
        pack200Provider.set(new dev.architectury.pack200.java.Pack200Adapter())
        mixinConfig "pickup.mixins.json"
    }
    mixin {
        defaultRefmapName.set("pickup.mixins.refmap.json")
    }
}

// Crucial: Essential Loom requires resource output directories to match the classes directory
sourceSets {
    main {
        output.resourcesDir = file("${buildDir}/classes/java/main")
    }
}

repositories {
    mavenCentral()
    // Using the official Sponge public repository is required for legacy SNAPSHOT dependencies
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://repo.essential.gg/repository/maven-public' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.8.9"
    mappings "de.oceanlabs.mcp:mcp_stable:22-1.8.9"
    forge "net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9"

    // 1.8.9 Forge LaunchWrapper requires Mixin 0.7.11 at runtime to avoid FML crashes.
    // This is added to implementation with transitive dependencies disabled.
    implementation("org.spongepowered:mixin:0.7.11-SNAPSHOT") {
        transitive = false
    }
    
    // Mixin 0.8.4-SNAPSHOT is used specifically as the annotationProcessor.
    annotationProcessor "org.spongepowered:mixin:0.8.4-SNAPSHOT"
}

processResources {
    inputs.property "version", project.version

    filesMatching('mcmod.info') {
        expand 'version': project.version
    }
}
